name: Update citation

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: update-citation
  cancel-in-progress: false

jobs:
  update-citation:
    if: ${{ github.event.release.prerelease == false }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Update citation metadata
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_PUBLISHED_AT: ${{ github.event.release.published_at }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          mapfile -t versions < <(
            git show "refs/tags/${RELEASE_TAG}:app/app/build.gradle.kts" |
              sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p'
          )

          if (( ${#versions[@]} != 1 )); then
            echo "Expected exactly one versionName in the released Gradle file." >&2
            exit 1
          fi

          app_version="${versions[0]}"
          tag_version="${RELEASE_TAG#v}"
          if [[ "${tag_version}" != "${app_version}" ]]; then
            echo "Release tag ${RELEASE_TAG} does not match app version ${app_version}." >&2
            exit 1
          fi

          if [[ ! "${RELEASE_PUBLISHED_AT}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]]; then
            echo "Release publication time is missing or invalid: ${RELEASE_PUBLISHED_AT}" >&2
            exit 1
          fi
          release_date="${RELEASE_PUBLISHED_AT%%T*}"

          awk -v version="${app_version}" -v date="${release_date}" '
            BEGIN { version_fields = 0; date_fields = 0 }
            /^version:/ {
              print "version: \"" version "\""
              version_fields++
              next
            }
            /^date-released:/ {
              print "date-released: \"" date "\""
              date_fields++
              next
            }
            { print }
            END {
              if (version_fields != 1 || date_fields != 1) {
                print "Expected exactly one version and date-released field." > "/dev/stderr"
                exit 1
              }
            }
          ' CITATION.cff > CITATION.cff.tmp
          mv CITATION.cff.tmp CITATION.cff

          if git diff --quiet -- CITATION.cff; then
            echo "CITATION.cff is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CITATION.cff
          git commit -m "Update citation for ${RELEASE_TAG}"
          git pull --rebase origin "${DEFAULT_BRANCH}"
          git push origin "HEAD:${DEFAULT_BRANCH}"
